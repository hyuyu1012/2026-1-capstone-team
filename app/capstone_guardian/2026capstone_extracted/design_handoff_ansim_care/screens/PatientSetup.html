<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>안심 케어 · 환자 연결 선택</title>
<link rel="stylesheet" href="wanted/colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: #f1f0ec;
    font-family: var(--font-sans);
    color: var(--label-normal);
  }
  .canvas {
    min-height: 100vh; padding: 56px 40px;
    display: flex; flex-direction: column; align-items: center;
  }
  .doc-head {
    width: 100%; max-width: 1000px; margin: 0 0 32px;
  }
  .doc-head .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--label-neutral); margin: 0 0 6px;
  }
  .doc-head h1 {
    margin: 0; font-family: var(--font-display);
    font-size: 26px; line-height: 1.2; letter-spacing: -0.02em;
    font-weight: 700; color: var(--label-strong);
  }
  .doc-head p {
    margin: 6px 0 0; font-size: 13.5px; color: var(--label-neutral);
    max-width: 720px; line-height: 1.5;
  }
  .row {
    display: flex; gap: 64px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px 4px 8px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line-normal-normal);
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--label-neutral); text-transform: uppercase;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--primary-normal); }
  .badge.b .dot { background: var(--label-strong); }
  .caption {
    font-size: 13px; color: var(--label-neutral); text-align: center;
    max-width: 320px; line-height: 1.5; font-weight: 500;
  }
  .caption strong { color: var(--label-strong); font-weight: 700; }
</style>
</head>
<body>

<div class="canvas">
  <header class="doc-head">
    <p class="eyebrow">안심 케어 · 첫 로그인 후</p>
    <h1>환자 연결 / 환자 생성 — 2가지 버전</h1>
    <p>로그인 직후 보호자가 마주하는 첫 분기 화면. 같은 결정을 다른 멘탈모델로 풀어봤어요.</p>
  </header>

  <div class="row">
    <div class="col">
      <span class="badge"><span class="dot"></span>버전 A · 카드 선택</span>
      <div id="mount-a"></div>
      <p class="caption"><strong>2개의 큰 카드</strong>로 선택지를 동등하게 보여주는 클래식한 분기. 의도가 명확하고 빠르게 선택할 수 있어요.</p>
    </div>

    <div class="col">
      <span class="badge b"><span class="dot"></span>버전 B · 코드 우선</span>
      <div id="mount-b"></div>
      <p class="caption"><strong>초대 코드 입력을 메인</strong>으로, 새로 시작은 하단 보조 액션으로. 가족이 먼저 가입해 코드를 받는 가장 흔한 케이스를 최적화.</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="android-frame.jsx"></script>

<script type="text/babel">
// ─── Icons ──────────────────────────────────────────────────────────
const LinkIcon = ({ size = 24, color = 'currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
    strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
    <path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.5 1.5"/>
    <path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.5-1.5"/>
  </svg>
);
const PlusUserIcon = ({ size = 24, color = 'currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
    strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="10" cy="8" r="4"/>
    <path d="M3 21c1-4 4-6.5 7-6.5s4 1 5 2.5"/>
    <path d="M18 14v6M15 17h6"/>
  </svg>
);
const Chevron = ({ size = 18 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M9 6l6 6-6 6"/>
  </svg>
);
const BackIcon = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <path d="M15 6l-6 6 6 6"/>
  </svg>
);

// ─── Shared chrome ──────────────────────────────────────────────────
function TopBar({ step, total }) {
  return (
    <div style={{ padding: '8px 12px 0', display: 'flex', alignItems: 'center', gap: 8 }}>
      <button aria-label="뒤로" style={{
        width: 40, height: 40, borderRadius: 999, border: 'none',
        background: 'transparent', cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'var(--label-strong)',
      }}><BackIcon /></button>
      <div style={{ flex: 1 }} />
      {step && total && (
        <span style={{
          fontSize: 11.5, fontWeight: 700, color: 'var(--label-alternative)',
          letterSpacing: '0.06em', padding: '4px 12px',
          background: 'var(--fill-alternative)', borderRadius: 999,
        }}>{step} / {total}</span>
      )}
    </div>
  );
}

// ─── VERSION A · 카드 선택 ──────────────────────────────────────────
function VersionA() {
  const [hover, setHover] = React.useState(null);
  return (
    <AndroidDevice width={360} height={760}>
      <div style={{
        height: '100%', background: '#fff',
        display: 'flex', flexDirection: 'column',
        fontFamily: 'var(--font-sans)', color: 'var(--label-normal)',
      }}>
        <TopBar step={1} total={3} />

        {/* Greeting */}
        <div style={{ padding: '20px 28px 8px' }}>
          <div style={{
            fontSize: 12, fontWeight: 700, color: 'var(--primary-normal)',
            letterSpacing: '0.06em',
          }}>환영합니다, 민준 님</div>
          <h1 style={{
            margin: '8px 0 0', fontSize: 24, fontWeight: 700,
            letterSpacing: '-0.022em', lineHeight: 1.3,
            color: 'var(--label-strong)',
          }}>
            돌봄을 시작할<br />
            <span style={{ color: 'var(--primary-normal)' }}>방법을 선택해주세요</span>
          </h1>
          <p style={{
            margin: '10px 0 0', fontSize: 13.5, lineHeight: 1.5,
            color: 'var(--label-neutral)', fontWeight: 500,
          }}>가족이 이미 가입했다면 연결하고, 처음이라면 새로 시작하세요.</p>
        </div>

        {/* Cards */}
        <div style={{ flex: 1, padding: '20px 24px 0', display: 'flex', flexDirection: 'column', gap: 12 }}>
          <ChoiceCard
            primary
            hovered={hover === 'link'}
            onHover={(v) => setHover(v ? 'link' : null)}
            icon={<LinkIcon color="#fff" />}
            tag="가족이 이미 가입했어요"
            title="기존 환자 연결"
            desc="가족에게 받은 초대 코드를 입력해 함께 돌봐요"
            meta="가장 흔한 경우"
          />
          <ChoiceCard
            hovered={hover === 'new'}
            onHover={(v) => setHover(v ? 'new' : null)}
            icon={<PlusUserIcon color="var(--label-strong)" />}
            tag="처음 시작합니다"
            title="새 환자 등록"
            desc="돌봄 대상자 정보를 입력하고 새로 시작해요"
            meta="약 2분 소요"
          />
        </div>

        {/* Footer */}
        <div style={{ padding: '16px 28px 24px', textAlign: 'center' }}>
          <button style={{
            background: 'transparent', border: 'none', cursor: 'pointer',
            fontSize: 12.5, fontWeight: 600, color: 'var(--label-neutral)',
            padding: 6,
          }}>나중에 설정할게요</button>
        </div>
      </div>
    </AndroidDevice>
  );
}

function ChoiceCard({ primary, hovered, onHover, icon, tag, title, desc, meta }) {
  return (
    <button
      onMouseEnter={() => onHover(true)}
      onMouseLeave={() => onHover(false)}
      style={{
        all: 'unset', cursor: 'pointer', display: 'block',
        background: primary ? 'var(--primary-normal)' : '#fff',
        color: primary ? '#fff' : 'var(--label-strong)',
        border: primary ? 'none' : '1px solid var(--line-normal-normal)',
        borderRadius: 18, padding: '18px 18px 16px',
        boxShadow: primary
          ? (hovered ? '0 10px 28px rgba(0,102,255,0.32)' : '0 6px 18px rgba(0,102,255,0.22)')
          : (hovered ? '0 4px 12px rgba(0,0,0,0.06)' : 'none'),
        transform: hovered ? 'translateY(-1px)' : 'none',
        transition: 'transform 150ms var(--ease-standard), box-shadow 150ms',
      }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 14 }}>
        <div style={{
          width: 44, height: 44, borderRadius: 12, flexShrink: 0,
          background: primary ? 'rgba(255,255,255,0.16)' : 'var(--fill-alternative)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>{icon}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            fontSize: 10.5, fontWeight: 700, letterSpacing: '0.08em',
            color: primary ? 'rgba(255,255,255,0.78)' : 'var(--label-alternative)',
            textTransform: 'uppercase', marginBottom: 4,
          }}>{tag}</div>
          <div style={{
            fontSize: 17, fontWeight: 700, letterSpacing: '-0.012em',
            color: primary ? '#fff' : 'var(--label-strong)',
          }}>{title}</div>
        </div>
        <div style={{ color: primary ? 'rgba(255,255,255,0.85)' : 'var(--label-alternative)', marginTop: 6 }}>
          <Chevron />
        </div>
      </div>
      <p style={{
        margin: '12px 0 0', fontSize: 13, lineHeight: 1.5,
        color: primary ? 'rgba(255,255,255,0.82)' : 'var(--label-neutral)',
        fontWeight: 500,
      }}>{desc}</p>
      <div style={{
        marginTop: 12, paddingTop: 12,
        borderTop: '1px solid ' + (primary ? 'rgba(255,255,255,0.18)' : 'var(--line-normal-neutral)'),
        fontSize: 11.5, fontWeight: 600, letterSpacing: '0.02em',
        color: primary ? 'rgba(255,255,255,0.78)' : 'var(--label-alternative)',
      }}>{meta}</div>
    </button>
  );
}

// ─── VERSION B · 코드 우선 ──────────────────────────────────────────
function VersionB() {
  const [code, setCode] = React.useState(['', '', '', '', '', '']);
  const refs = React.useRef([]);
  const valid = code.every(c => c !== '');

  const onChange = (i, v) => {
    const ch = v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 1);
    const next = [...code];
    next[i] = ch;
    setCode(next);
    if (ch && i < 5) refs.current[i + 1]?.focus();
  };
  const onKey = (i, e) => {
    if (e.key === 'Backspace' && !code[i] && i > 0) refs.current[i - 1]?.focus();
  };

  return (
    <AndroidDevice width={360} height={760}>
      <div style={{
        height: '100%', background: '#fff',
        display: 'flex', flexDirection: 'column',
        fontFamily: 'var(--font-sans)', color: 'var(--label-normal)',
      }}>
        <TopBar step={1} total={3} />

        {/* Greeting */}
        <div style={{ padding: '20px 28px 0' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{
              width: 36, height: 36, borderRadius: 12,
              background: 'rgba(0,102,255,0.10)', color: 'var(--primary-normal)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}><LinkIcon size={20} color="var(--primary-normal)"/></div>
            <div style={{
              fontSize: 12, fontWeight: 700, color: 'var(--label-neutral)',
              letterSpacing: '0.06em', textTransform: 'uppercase',
            }}>STEP 1 · 가족과 연결</div>
          </div>
          <h1 style={{
            margin: '14px 0 0', fontSize: 24, fontWeight: 700,
            letterSpacing: '-0.022em', lineHeight: 1.3,
            color: 'var(--label-strong)',
          }}>초대 코드를 입력하세요</h1>
          <p style={{
            margin: '8px 0 0', fontSize: 13.5, lineHeight: 1.5,
            color: 'var(--label-neutral)', fontWeight: 500,
          }}>가족에게서 받은 6자리 코드를 입력하면<br/>같은 환자를 함께 돌볼 수 있어요.</p>
        </div>

        {/* Code input */}
        <div style={{ padding: '28px 24px 0' }}>
          <div style={{ display: 'flex', gap: 8, justifyContent: 'space-between' }}>
            {code.map((c, i) => (
              <input
                key={i}
                ref={(el) => refs.current[i] = el}
                value={c}
                onChange={(e) => onChange(i, e.target.value)}
                onKeyDown={(e) => onKey(i, e)}
                maxLength={1}
                inputMode="text"
                style={{
                  width: 44, height: 56, padding: 0, textAlign: 'center',
                  border: '1px solid ' + (c ? 'var(--primary-normal)' : 'var(--line-normal-normal)'),
                  borderRadius: 12, background: '#fff',
                  fontFamily: 'var(--font-mono)',
                  fontSize: 24, fontWeight: 700, letterSpacing: 0,
                  color: 'var(--label-strong)', outline: 'none',
                  boxShadow: c ? '0 0 0 3px rgba(0,102,255,0.10)' : 'none',
                  transition: 'border 120ms, box-shadow 120ms',
                }}
              />
            ))}
          </div>
          {/* helper */}
          <div style={{
            marginTop: 14, display: 'flex', alignItems: 'center', gap: 8,
            fontSize: 12.5, color: 'var(--label-neutral)', fontWeight: 500,
          }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h0"/>
            </svg>
            코드는 보호자 앱 → 설정 → 보호자 연결에서 확인할 수 있어요
          </div>
        </div>

        {/* Submit */}
        <div style={{ padding: '20px 24px 0' }}>
          <button disabled={!valid} style={{
            width: '100%', height: 52, borderRadius: 12, border: 'none',
            background: valid ? 'var(--primary-normal)' : 'var(--fill-neutral)',
            color: valid ? '#fff' : 'var(--label-alternative)',
            fontSize: 15, fontWeight: 700, letterSpacing: '-0.005em',
            cursor: valid ? 'pointer' : 'not-allowed',
            boxShadow: valid ? '0 4px 12px rgba(0,102,255,0.18)' : 'none',
          }}>환자와 연결</button>
        </div>

        <div style={{ flex: 1 }} />

        {/* Secondary action - new patient */}
        <div style={{ padding: '0 24px 16px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '4px 0 12px' }}>
            <div style={{ flex: 1, height: 1, background: 'var(--line-normal-neutral)' }}/>
            <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--label-alternative)', letterSpacing: '0.06em' }}>또는</span>
            <div style={{ flex: 1, height: 1, background: 'var(--line-normal-neutral)' }}/>
          </div>
          <button style={{
            width: '100%', padding: '14px 18px', borderRadius: 12,
            background: '#fff', border: '1px solid var(--line-normal-normal)',
            display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer',
            textAlign: 'left',
          }}>
            <div style={{
              width: 36, height: 36, borderRadius: 10,
              background: 'var(--fill-alternative)', color: 'var(--label-strong)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexShrink: 0,
            }}><PlusUserIcon size={20} color="var(--label-strong)"/></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--label-strong)' }}>새 환자 등록</div>
              <div style={{ fontSize: 12, color: 'var(--label-neutral)', marginTop: 1, fontWeight: 500 }}>가족 중 처음이라면 새로 시작</div>
            </div>
            <div style={{ color: 'var(--label-alternative)' }}><Chevron /></div>
          </button>
        </div>

        <div style={{ padding: '0 28px 24px', textAlign: 'center' }}>
          <button style={{
            background: 'transparent', border: 'none', cursor: 'pointer',
            fontSize: 12.5, fontWeight: 600, color: 'var(--label-alternative)',
            padding: 6,
          }}>나중에 설정</button>
        </div>
      </div>
    </AndroidDevice>
  );
}

ReactDOM.createRoot(document.getElementById('mount-a')).render(<VersionA />);
ReactDOM.createRoot(document.getElementById('mount-b')).render(<VersionB />);
</script>

</body>
</html>
